<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padel Buddies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'padel-blue': '#0085CF',
              'padel-blue-darker': '#006BAA',
              'padel-court-blue': '#0d1b2a',
              'padel-court-blue-dark': '#010f1c',
              'padel-glow-white': '#ffffff',
              'padel-amber': '#f59e0b',
              'padel-amber-light': '#fbbf24',
              'padel-green': '#34d399',
            },
            boxShadow: {
               'neon-white': '0 0 7px #ffffff, 0 0 12px #ffffff, 0 0 18px #60a5fa',
            },
            keyframes: {
              flash: {
                '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                '50%': { opacity: 0.7, transform: 'scale(1.02)' },
              },
              'bounce-subtle': {
                '0%, 100%': {
                  transform: 'translateY(-5%)',
                  animationTimingFunction: 'cubic-bezier(0.8,0,1,1)',
                },
                '50%': {
                  transform: 'translateY(0)',
                  animationTimingFunction: 'cubic-bezier(0,0,0.2,1)',
                },
              },
              'contour-glow': {
                '0%': { boxShadow: '0 -4px 15px -3px #ffffff' },
                '25%': { boxShadow: '4px 0 15px -3px #ffffff' },
                '50%': { boxShadow: '0 4px 15px -3px #ffffff' },
                '75%': { boxShadow: '-4px 0 15px -3px #ffffff' },
                '100%': { boxShadow: '0 -4px 15px -3px #ffffff' },
              },
              'tag-book-now-glow': {
                  '0%, 100%': {
                    borderColor: '#0085CF',
                    boxShadow: '0 0 6px #0085CF, 0 0 10px #60a5fa',
                    backgroundColor: 'rgba(0, 133, 207, 0.15)',
                  },
                  '50%': {
                    borderColor: '#f59e0b', // padel-amber
                    boxShadow: '0 0 6px #fbbf24, 0 0 10px #f59e0b', // padel-amber-light, padel-amber
                    backgroundColor: 'rgba(245, 158, 11, 0.15)',
                  }
              },
               'tag-game-on-glow': {
                  '0%, 100%': {
                    borderColor: '#0085CF', // padel-blue
                    boxShadow: '0 0 6px #0085CF, 0 0 10px #60a5fa',
                    backgroundColor: 'rgba(0, 133, 207, 0.15)',
                  },
                  '50%': {
                    borderColor: '#34d399', // padel-green
                    boxShadow: '0 0 6px #34d399, 0 0 10px #6ee7b7',
                    backgroundColor: 'rgba(52, 211, 153, 0.15)',
                  }
              },
              'tag-pending-glow': {
                  '0%, 100%': {
                    borderColor: '#0085CF',
                    boxShadow: '0 0 6px #0085CF, 0 0 10px #60a5fa',
                    backgroundColor: 'rgba(0, 133, 207, 0.15)',
                  },
                  '50%': {
                    borderColor: '#d1d5db',
                    boxShadow: '0 0 6px #d1d5db, 0 0 10px #d1d5db',
                    backgroundColor: 'rgba(209, 213, 219, 0.15)',
                  }
              },
              'tag-joined-glow': {
                  '0%, 100%': {
                    borderColor: '#0085CF', // padel-blue
                    boxShadow: '0 0 6px #0085CF, 0 0 10px #60a5fa',
                    backgroundColor: 'rgba(0, 133, 207, 0.15)',
                  },
                  '50%': {
                    borderColor: '#f59e0b', // padel-amber
                    boxShadow: '0 0 6px #fbbf24, 0 0 10px #f59e0b', // padel-amber-light, padel-amber
                    backgroundColor: 'rgba(245, 158, 11, 0.15)',
                  }
              },
              'button-rainbow-glow': {
                '0%, 100%': {
                  backgroundColor: '#059669', // emerald-600
                  boxShadow: '0 0 5px #34d399, 0 0 10px #34d399, 0 0 15px #34d399',
                  transform: 'scale(1)'
                },
                '25%': {
                  backgroundColor: '#10b981', // emerald-500
                  boxShadow: '0 0 7px #60a5fa, 0 0 14px #60a5fa, 0 0 20px #60a5fa',
                  transform: 'scale(1.03)'
                },
                '50%': {
                  backgroundColor: '#059669', // emerald-600
                  boxShadow: '0 0 10px #f472b6, 0 0 20px #f472b6, 0 0 30px #f472b6',
                  transform: 'scale(1.05)'
                },
                '75%': {
                  backgroundColor: '#10b981', // emerald-500
                  boxShadow: '0 0 7px #a78bfa, 0 0 14px #a78bfa, 0 0 20px #a78bfa',
                  transform: 'scale(1.03)'
                }
              },
               'button-neon-blue-glow': {
                '0%, 100%': {
                    backgroundColor: '#006BAA', // padel-blue-darker
                    boxShadow: '0 0 5px #0085CF, 0 0 10px #0085CF, 0 0 15px #60a5fa',
                    transform: 'scale(1)',
                },
                '50%': {
                    backgroundColor: '#f59e0b', // padel-amber
                    boxShadow: '0 0 10px #fbbf24, 0 0 20px #fbbf24, 0 0 30px #f59e0b', // padel-amber-light
                    transform: 'scale(1.03)',
                }
              },
              'button-join-now-glow': {
                '0%, 100%': {
                    backgroundColor: '#006BAA', // padel-blue-darker
                    boxShadow: '0 0 7px #0085CF, 0 0 14px #0085CF, 0 0 20px #60a5fa',
                    transform: 'scale(1.03)',
                },
                '50%': {
                    backgroundColor: '#0085CF', // padel-blue
                    boxShadow: '0 0 5px #e5e7eb, 0 0 10px #e5e7eb, 0 0 15px #ffffff',
                    transform: 'scale(1)',
                }
              },
              'button-amber-glow': {
                '0%, 100%': {
                    backgroundColor: '#f59e0b', // amber-500
                    boxShadow: '0 0 8px #f59e0b, 0 0 16px #fbbf24, 0 0 24px #fcd34d',
                    transform: 'scale(1.03)',
                },
                '50%': {
                    backgroundColor: '#d97706', // amber-600
                    boxShadow: '0 0 4px #f59e0b, 0 0 8px #fbbf24, 0 0 12px #fcd34d',
                    transform: 'scale(1)',
                }
              },
              'waiting-for-buddies-glow': {
                '0%, 100%': {
                    backgroundColor: '#006BAA', // padel-blue-darker
                    boxShadow: '0 0 7px #0085CF, 0 0 14px #60a5fa',
                    transform: 'scale(1.02)',
                },
                '50%': {
                    backgroundColor: '#f59e0b', // padel-amber
                    boxShadow: '0 0 10px #fbbf24, 0 0 20px #f59e0b', // padel-amber-light, padel-amber
                    transform: 'scale(1)',
                }
              }
            },
            animation: {
              flash: 'flash 1.5s ease-in-out infinite',
              'bounce-subtle': 'bounce-subtle 1.5s ease-in-out infinite',
              'contour-glow': 'contour-glow 4s linear infinite',
              'tag-book-now-glow': 'tag-book-now-glow 2s ease-in-out infinite',
              'tag-game-on-glow': 'tag-game-on-glow 2s ease-in-out infinite',
              'tag-pending-glow': 'tag-pending-glow 2s ease-in-out infinite',
              'tag-joined-glow': 'tag-joined-glow 2s ease-in-out infinite',
              'button-rainbow-glow': 'button-rainbow-glow 2.5s ease-in-out infinite',
              'button-neon-blue-glow': 'button-neon-blue-glow 2s ease-in-out infinite',
              'button-join-now-glow': 'button-join-now-glow 2.5s ease-in-out infinite',
              'button-amber-glow': 'button-amber-glow 2s ease-in-out infinite',
              'waiting-for-buddies-glow': 'waiting-for-buddies-glow 2s ease-in-out infinite',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<style>
  body {
    background-image: url("data:image/svg+xml,%3Csvg width='200' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cstyle%3E.line %7B fill: none; stroke: '%230085CF'; stroke-opacity: 0.1; stroke-width: 1; %7D%3C/style%3E%3C/defs%3E%3Crect class='line' x='1' y='1' width='198' height='98' /%3E%3Cline class='line' x1='100' y1='1' x2='100' y2='99' /%3E%3Cline class='line' x1='30' y1='1' x2='30' y2='99' /%3E%3Cline class='line' x1='170' y1='1' x2='170' y2='99' /%3E%3Cline class='line' x1='30' y1='50' x2='170' y2='50' /%3E%3C/svg%3E");
    background-size: 200px 100px;
  }
</style>

</head>
  <body class="bg-padel-court-blue-dark">

</html>
